<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lee Mobile Services Admin</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>👨‍💼 Lee Mobile Services Admin Dashboard</h1>

<button id="logoutBtn" class="primary-btn">
🚪 Logout
</button>

</header>

<div class="dashboard-card">

<h2>📊 Dashboard Statistics</h2>

<div class="stats">

<div class="stat-card">
<h3>Total Bookings</h3>
<h1 id="totalBookings">0</h1>
</div>

<div class="stat-card">
<h3>Pending</h3>
<h1 id="pendingBookings">0</h1>
</div>

<div class="stat-card">
<h3>Completed</h3>
<h1 id="completedBookings">0</h1>
</div>

</div>

</div>

<h2>📋 Customer Bookings</h2>

<table id="bookingTable">

<thead>
<tr>
<th>Name</th>
<th>Phone</th>
<th>Service</th>
<th>Address</th>
<th>Date</th>
<th>Time</th>
<th>Photo</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="bookingList">
</tbody>

</table>

<footer>

<p>© 2026 Lee Mobile Services</p>

</footer>

<script type="module" src="admin.js"></script>

</body>

</html>
