<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book a Service | Lee Mobile Services</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">

<h1>Lee Mobile Services</h1>

<p>Book Your Service</p>

</div>

<nav>

<a href="index.html">🏠 Home</a>

<a href="services.html">🧺 Services</a>

<a href="prices.html">💰 Prices</a>

<a href="contact.html">📞 Contact</a>

</nav>

</header>

<section class="booking-section">

<h2>Book Your Service</h2>

<form id="bookingForm">

<label>Full Name</label>

<input
type="text"
id="name"
placeholder="Enter your full name"
required>

<label>Phone Number</label>

<input
type="tel"
id="phone"
placeholder="e.g. 0812345678"
required>

<label>Email (Optional)</label>

<input
type="email"
id="email"
placeholder="example@email.com">

<label>Select Service</label><div id="priceDisplay" class="price-box">
    <strong>Estimated Price:</strong> R250
</div>

<select id="service">

<option>Mobile Laundry</option>

<option>Mobile Car Wash</option>

<option>Home Cleaning</option>

<option>Window Cleaning</option>

<option>Couch Cleaning</option>

<option>Mattress Cleaning</option>

<option>Pool Cleaning</option>

<option>Plumbing</option>

<option>Dog Wash</option>

<option>Home Renovations</option>

<option>Painting</option>

<option>Shoe Cleaning</option>

</select>

<label>Preferred Date</label>

<input
type="date"
id="date"
required>

<label>Preferred Time</label>

<input
type="time"
id="time"
required>

<label>Property Type</label>

<select id="property">

<option>House</option>

<option>Apartment</option>

<option>Office</option>

<option>Business</option>

</select>

<label>Address</label>

<input
type="text"
id="address"
placeholder="Enter service address"
required>

<button
type="button"
id="locationBtn">

📍 Use My Current Location

</button>

<label>Upload Photos (Optional)</label>

<input
type="file"
id="photos"
accept="image/*"
multiple>

<label>Special Instructions</label>

<textarea
id="notes"
rows="5"
placeholder="Tell us anything we should know..."></textarea>

<h3>Payment Method</h3>

<label>

<input
type="radio"
name="payment"
value="Cash"
checked>

Cash

</label>

<label>

<input
type="radio"
name="payment"
value="EFT">

EFT

</label>

<label>

<input
type="radio"
name="payment"
value="Card">

Card

</label>

<label>

<input
type="radio"
name="payment"
value="iKhokha">

iKhokha

</label>

<button
type="submit"
id="bookBtn">

💬 Book on WhatsApp

</button>

</form>

</section>

<footer>

<p>

© 2026 Lee Mobile Laundry,
Car Wash & Cleaning Services

</p>

</footer>

<script src="booking.js"></script>

</body><script src="price.js"></script>
<script src="booking.js"></script>

</html>
