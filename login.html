
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Lee Mobile Services</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">

<h1>Lee Mobile Services</h1>

<p>Administrator Login</p>

</div>

</header>

<section class="login-container">

<h2>🔐 Admin Login</h2>

<p>Please sign in to access the Admin Dashboard.</p>

<form id="loginForm">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

<button type="submit">

Login

</button>

</form>

<br>

<p id="loginMessage"></p>

<br>

<a href="index.html">

<button type="button">

⬅ Back to Home

</button>

</a>

</section>

<footer>

<p>

© 2026 Lee Mobile Services

</p>

</footer>

<script type="module" src="auth.js"></script>

</body>

</html>
